<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .terminal-text {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-weight: bold;
        font-size: 55px;
        fill: #00ffcc;
        text-shadow: 0 0 8px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.3);
      }
      
      .matrix-col {
        font-family: 'Share Tech Mono', monospace;
        font-size: 11px;
        fill: #00ff66;
        user-select: none;
      }
      
      .sub-text {
        font-family: 'Share Tech Mono', 'Courier New', Courier, monospace;
        font-size: 13px;
        letter-spacing: 2px;
        font-weight: bold;
      }

      /* Matrix fall animations */
      @keyframes matrix-fall-1 {
        0% { transform: translateY(-120px); opacity: 0; }
        10% { opacity: 0.2; }
        90% { opacity: 0.2; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes matrix-fall-2 {
        0% { transform: translateY(-120px); opacity: 0; }
        10% { opacity: 0.15; }
        90% { opacity: 0.15; }
        100% { transform: translateY(180px); opacity: 0; }
      }

      .m-col-1 { animation: matrix-fall-1 4.5s infinite linear; }
      .m-col-2 { animation: matrix-fall-2 3.8s infinite linear; }
      .m-col-3 { animation: matrix-fall-1 5.2s infinite linear; }
      .m-col-4 { animation: matrix-fall-2 4.1s infinite linear; }

      /* Scrambler Roll Animations */
      @keyframes roll-slot-1 {
        0% { transform: translateY(0); }
        2% { transform: translateY(-120px); }
        5% { transform: translateY(-300px); }
        8% { transform: translateY(-180px); }
        11% { transform: translateY(-480px); }
        14% { transform: translateY(-540px); }
        17% { transform: translateY(-600px); }
        90% { transform: translateY(-600px); }
        93% { transform: translateY(-360px); }
        96% { transform: translateY(-120px); }
        100% { transform: translateY(0); }
      }

      @keyframes roll-slot-2 {
        0% { transform: translateY(0); }
        3% { transform: translateY(-180px); }
        6% { transform: translateY(-60px); }
        10% { transform: translateY(-420px); }
        14% { transform: translateY(-240px); }
        18% { transform: translateY(-540px); }
        22% { transform: translateY(-600px); }
        90% { transform: translateY(-600px); }
        94% { transform: translateY(-240px); }
        98% { transform: translateY(-60px); }
        100% { transform: translateY(0); }
      }

      @keyframes roll-slot-3 {
        0% { transform: translateY(0); }
        4% { transform: translateY(-240px); }
        8% { transform: translateY(-120px); }
        13% { transform: translateY(-480px); }
        18% { transform: translateY(-300px); }
        22% { transform: translateY(-540px); }
        26% { transform: translateY(-600px); }
        90% { transform: translateY(-600px); }
        95% { transform: translateY(-180px); }
        98% { transform: translateY(-120px); }
        100% { transform: translateY(0); }
      }

      .slot-1 { animation: roll-slot-1 7s infinite cubic-bezier(0.25, 1, 0.5, 1); }
      .slot-2 { animation: roll-slot-2 7s infinite cubic-bezier(0.25, 1, 0.5, 1); }
      .slot-3 { animation: roll-slot-3 7s infinite cubic-bezier(0.25, 1, 0.5, 1); }

      /* Blinking Cursor */
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 99% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.8s infinite;
        fill: #00ffcc;
        filter: drop-shadow(0 0 4px rgba(0,255,204,0.6));
      }

      /* Subtitle animations */
      @keyframes sub-decipher {
        0%, 25% { opacity: 1; }
        26%, 100% { opacity: 0; }
      }
      @keyframes sub-online {
        0%, 25% { opacity: 0; }
        26%, 90% { opacity: 1; }
        91%, 100% { opacity: 0; }
      }
      .sub-loading {
        fill: #ff3366;
        text-shadow: 0 0 5px rgba(255, 51, 102, 0.6);
        animation: sub-decipher 7s infinite;
      }
      .sub-ready {
        fill: #00ffcc;
        text-shadow: 0 0 5px rgba(0, 255, 204, 0.6);
        animation: sub-online 7s infinite;
      }

      /* Scanline overlay pattern */
      .scanlines {
        fill: url(#scanline-pattern);
        opacity: 0.08;
        pointer-events: none;
      }
    </style>
    
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>

    <pattern id="scanline-pattern" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000" stroke-width="2" />
    </pattern>
    
    <clipPath id="text-clip">
      <rect x="0" y="38" width="600" height="64" />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#0a0b10" rx="10" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="10" />

  <!-- Falling Matrix Code (Background layer) -->
  <g opacity="0.4">
    <!-- Col 1 -->
    <text x="40" y="0" class="matrix-col m-col-1">
      <tspan x="40" dy="15">▩</tspan>
      <tspan x="40" dy="15">1</tspan>
      <tspan x="40" dy="15">0</tspan>
      <tspan x="40" dy="15">▚</tspan>
      <tspan x="40" dy="15">Ø</tspan>
      <tspan x="40" dy="15">Σ</tspan>
    </text>
    <!-- Col 2 -->
    <text x="140" y="0" class="matrix-col m-col-2" style="animation-delay: 1.5s;">
      <tspan x="140" dy="15">█</tspan>
      <tspan x="140" dy="15">7</tspan>
      <tspan x="140" dy="15">▩</tspan>
      <tspan x="140" dy="15">æ</tspan>
      <tspan x="140" dy="15">1</tspan>
      <tspan x="140" dy="15">0</tspan>
    </text>
    <!-- Col 3 -->
    <text x="460" y="0" class="matrix-col m-col-3" style="animation-delay: 0.8s;">
      <tspan x="460" dy="15">▞</tspan>
      <tspan x="460" dy="15">0</tspan>
      <tspan x="460" dy="15">μ</tspan>
      <tspan x="460" dy="15">1</tspan>
      <tspan x="460" dy="15">λ</tspan>
      <tspan x="460" dy="15">▩</tspan>
    </text>
    <!-- Col 4 -->
    <text x="540" y="0" class="matrix-col m-col-4" style="animation-delay: 2.2s;">
      <tspan x="540" dy="15">1</tspan>
      <tspan x="540" dy="15">0</tspan>
      <tspan x="540" dy="15">π</tspan>
      <tspan x="540" dy="15">▚</tspan>
      <tspan x="540" dy="15">θ</tspan>
      <tspan x="540" dy="15">█</tspan>
    </text>
  </g>

  <!-- Cyber Border & Panels -->
  <rect x="10" y="10" width="580" height="160" rx="8" fill="none" stroke="#1f2438" stroke-width="1.5" />
  
  <!-- Neon corner highlights -->
  <path d="M 10 35 L 10 10 L 35 10" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 590 35 L 590 10 L 565 10" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 10 145 L 10 170 L 35 170" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 590 145 L 590 170 L 565 170" fill="none" stroke="#00ffcc" stroke-width="2.5" stroke-linecap="round" />

  <!-- Deciphering Terminal Text -->
  <g clip-path="url(#text-clip)">
    <!-- Slot 1 (N) -->
    <g class="slot-1">
      <text x="220" y="86" class="terminal-text">_</text>
      <text x="220" y="146" class="terminal-text">0</text>
      <text x="220" y="206" class="terminal-text">1</text>
      <text x="220" y="266" class="terminal-text">▚</text>
      <text x="220" y="326" class="terminal-text">¶</text>
      <text x="220" y="386" class="terminal-text">¥</text>
      <text x="220" y="446" class="terminal-text">Σ</text>
      <text x="220" y="506" class="terminal-text">Ω</text>
      <text x="220" y="566" class="terminal-text">β</text>
      <text x="220" y="626" class="terminal-text">æ</text>
      <text x="220" y="686" class="terminal-text">N</text>
    </g>

    <!-- Slot 2 (E) -->
    <g class="slot-2">
      <text x="270" y="86" class="terminal-text">_</text>
      <text x="270" y="146" class="terminal-text">1</text>
      <text x="270" y="206" class="terminal-text">0</text>
      <text x="270" y="266" class="terminal-text">▞</text>
      <text x="270" y="326" class="terminal-text">§</text>
      <text x="270" y="386" class="terminal-text">€</text>
      <text x="270" y="446" class="terminal-text">Δ</text>
      <text x="270" y="506" class="terminal-text">μ</text>
      <text x="270" y="566" class="terminal-text">λ</text>
      <text x="270" y="626" class="terminal-text">œ</text>
      <text x="270" y="686" class="terminal-text">E</text>
    </g>

    <!-- Slot 3 (X) -->
    <g class="slot-3">
      <text x="320" y="86" class="terminal-text">_</text>
      <text x="320" y="146" class="terminal-text">0</text>
      <text x="320" y="206" class="terminal-text">1</text>
      <text x="320" y="266" class="terminal-text">█</text>
      <text x="320" y="326" class="terminal-text">‡</text>
      <text x="320" y="386" class="terminal-text">£</text>
      <text x="320" y="446" class="terminal-text">Ξ</text>
      <text x="320" y="506" class="terminal-text">π</text>
      <text x="320" y="566" class="terminal-text">θ</text>
      <text x="320" y="626" class="terminal-text">ÿ</text>
      <text x="320" y="686" class="terminal-text">X</text>
    </g>
  </g>

  <!-- Blinking Cursor -->
  <rect x="365" y="48" width="16" height="42" class="cursor" />

  <!-- Subtitle Area -->
  <text x="300" y="132" text-anchor="middle" class="sub-text sub-loading">[ DECRYPTING_PROFILE... ]</text>
  <text x="300" y="132" text-anchor="middle" class="sub-text sub-ready">[ SECURITY RESEARCH &amp; SOFTWARE DEVELOPMENT ]</text>

  <!-- Decorative horizontal rule -->
  <line x1="150" y1="145" x2="450" y2="145" stroke="#1f2438" stroke-dasharray="5,5" stroke-width="1" />

  <!-- Overlay scanlines -->
  <rect width="100%" height="100%" class="scanlines" rx="10" />
</svg>
